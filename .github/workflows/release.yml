name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'scruge1/universal-benchmark-router'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact tagged bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up explicit Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned verification dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Install exact source without resolving another dependency set
        run: python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Verify tag matches package version
        run: python tools/verify_release_tag.py --tag "$GITHUB_REF_NAME"
      - name: Verify exact source manifest
        run: python tools/source_manifest.py --verify
      - name: Run portable tests
        run: python -m pytest -q
      - name: Run static and bytecode checks
        run: |
          ruff check .
          python -m compileall -q universal_model_router.py universal_benchmark_exchange.py universal_benchmark_registry.py universal_router_cli.py router tools
      - name: Verify the local-adapter boundary
        run: python verify_portable_router_boundary.py --root .
      - name: Generate a CI-only signed fixture bundle
        run: python tools/generate_ci_fixture_bundle.py --output .ci-fixtures
      - name: Verify fixture intake and routing non-qualification
        run: python tools/verify_ci_fixture_bundle.py --bundle .ci-fixtures
      - name: Generate two-contributor installed-CLI fixture
        run: python tools/generate_e2e_cli_fixture.py --output .ci-e2e
      - name: Run installed CLI from intake through route selection
        run: |
          universal-router registry-init --root .ci-e2e-registry
          universal-router export-contracts --output-dir .ci-contracts
          universal-router ingest-contribution --contribution .ci-e2e/contribution-a.json --suite .ci-e2e/suite.json --public-keys .ci-e2e/public-keys.json --root .ci-e2e-registry
          universal-router ingest-contribution --contribution .ci-e2e/contribution-b.json --suite .ci-e2e/suite.json --public-keys .ci-e2e/public-keys.json --root .ci-e2e-registry
          universal-router ingest-acknowledgement --acknowledgement .ci-e2e/acknowledgement-a.json --contribution .ci-e2e/contribution-a.json --suite .ci-e2e/suite.json --public-keys .ci-e2e/public-keys.json --root .ci-e2e-registry
          universal-router ingest-acknowledgement --acknowledgement .ci-e2e/acknowledgement-b.json --contribution .ci-e2e/contribution-b.json --suite .ci-e2e/suite.json --public-keys .ci-e2e/public-keys.json --root .ci-e2e-registry
          universal-router compile-catalog --root .ci-e2e-registry --suite .ci-e2e/suite.json --generation 1 --compiled-at 2026-09-09T09:30:00Z --output .ci-e2e-catalog.json
          universal-router route --request .ci-e2e/route-request.json --suite .ci-e2e/suite.json --catalog .ci-e2e-catalog.json --profile .ci-e2e/local-profile.json --output .ci-e2e-decision.json
          python tools/verify_e2e_cli_fixture.py --bundle .ci-e2e --catalog .ci-e2e-catalog.json --decision .ci-e2e-decision.json
      - name: Build source and wheel distributions
        run: python -m build --no-isolation --outdir dist
      - name: Verify release contents
        run: python tools/verify_release_contents.py --dist dist
      - name: Attest exact release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Create versioned GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
