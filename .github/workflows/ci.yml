name: portable-router-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-router-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            package: true
          - os: ubuntu-latest
            python-version: "3.13"
            package: false
          - os: windows-latest
            python-version: "3.13"
            package: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact pull-request or commit bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up explicit Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned verification dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Install the package without resolving another dependency set
        run: python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Verify exact source manifest
        run: python tools/source_manifest.py --verify
      - name: Run portable tests
        run: python -m pytest -q
      - name: Run static and bytecode checks
        run: |
          ruff check .
          python -m compileall -q universal_model_router.py universal_benchmark_exchange.py universal_benchmark_registry.py universal_router_cli.py tools
      - name: Verify the local-adapter boundary
        run: python verify_portable_router_boundary.py --root .
      - name: Generate a CI-only signed fixture bundle
        run: python tools/generate_ci_fixture_bundle.py --output .ci-fixtures
      - name: Verify fixture intake and routing non-qualification
        run: python tools/verify_ci_fixture_bundle.py --bundle .ci-fixtures
      - name: Build source and wheel distributions
        if: matrix.package
        run: python -m build --no-isolation --outdir dist
      - name: Verify release contents
        if: matrix.package
        run: python tools/verify_release_contents.py --dist dist
